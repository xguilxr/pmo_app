# Render Blueprint — backend PMOAAS
# Uso: en Render Dashboard → New → Blueprint → conecta este repo.
# Render detecta este archivo y ofrece crear los servicios definidos abajo.
#
# Nota: el frontend NO se despliega aqui — vive en HostGator (public_html)
# y apunta VITE_API_URL al dominio *.onrender.com del servicio pmo-api.

services:
  - type: web
    name: pmo-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      # Render inyecta PORT automaticamente
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      # Configura estos desde el dashboard de Render (sync: false = secretos):
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DOMAIN
        sync: false
      # IA desactivada por defecto; activa desde el dashboard si la necesitas
      - key: AI_ENABLED
        value: "false"
      - key: AI_DEFAULT_ENGINE
        value: disabled
      - key: MPXJ_ENABLED
        value: "false"
      - key: DEFAULT_LOCALE
        value: es
      - key: SUPPORTED_LOCALES
        value: es,en
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: DATABASE_POOL_SIZE
        value: "5"
