# Production Nginx configuration for multi-tenant PMO Platform
#
# Install:
#   sudo cp nginx-production.conf /etc/nginx/sites-available/pmo-platform
#   sudo ln -s /etc/nginx/sites-available/pmo-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   - Wildcard SSL cert for *.yourplatform.com (Let's Encrypt or similar)
#   - DNS: *.yourplatform.com -> server IP (A record or wildcard CNAME)
#   - Frontend built to /opt/pmo_app/frontend/dist

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name *.yourplatform.com yourplatform.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server — handles bare domain + all subdomains
server {
    listen 443 ssl http2;
    server_name *.yourplatform.com yourplatform.com;

    # SSL certificates (wildcard)
    ssl_certificate     /etc/letsencrypt/live/yourplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourplatform.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /opt/pmo_app/frontend/dist;
    index index.html;

    # API proxy to Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        client_max_body_size 50M;
    }

    # Per-tenant static assets
    location /static/tenants/ {
        alias /opt/pmo_app/backend/static/tenants/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # File uploads
    location /uploads/ {
        alias /opt/pmo_app/backend/uploads/;
        expires 1d;
    }

    # Swagger / Redoc (disable in production if desired)
    location /docs {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
