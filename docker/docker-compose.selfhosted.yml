# Docker Compose para self-hosted: backend en PC + DB en HostGator remoto
#
# Diferencias vs docker-compose.yml (dev/all-in-one):
#   - NO corre MySQL local (se usa HostGator MySQL remoto via DATABASE_URL en .env)
#   - NO corre frontend (se compila y sube a HostGator public_html)
#   - restart: unless-stopped para que sobreviva reinicios de Docker Desktop
#   - Lee .env del repo root (no hardcodea secretos)
#
# Uso:
#   docker compose -f docker/docker-compose.selfhosted.yml up -d
#   docker compose -f docker/docker-compose.selfhosted.yml logs -f backend
#   docker compose -f docker/docker-compose.selfhosted.yml exec backend python -m app.seed --demo
#
# Ver docs/deploy-self-hosted.md para la guia completa.

services:
  backend:
    container_name: pmo-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8080:8080"  # solo local — cloudflared tunnel expone esto al internet
    volumes:
      - ../uploads:/app/uploads
      - ../static/tenants:/app/static/tenants
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
