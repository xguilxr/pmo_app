# Multi-tenant PMO Platform — Nginx configuration
#
# Accepts requests on any subdomain (wildcard *.yourplatform.com) or custom
# domains.  The Host header is forwarded to the backend so that
# TenantMiddleware can resolve the correct tenant.

server {
    listen 80;
    server_name _;           # Catch-all: bare domain, subdomains, custom domains

    root /usr/share/nginx/html;
    index index.html;

    # ---- API proxy to backend (Gunicorn / Uvicorn) ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        client_max_body_size 50M;
    }

    # ---- Per-tenant static assets (logos, favicons) ----
    location /static/tenants/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Swagger / Redoc docs proxy ----
    location /docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # ---- SPA fallback — all frontend routes go to index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Cache static assets (JS, CSS, images, fonts) ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
