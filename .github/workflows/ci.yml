name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # -----------------------------------------------------------------------
  # Backend checks
  # -----------------------------------------------------------------------
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          cd backend
          ruff check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pmo_test
          POSTGRES_USER: pmo_user
          POSTGRES_PASSWORD: test_secret
        options: >-
          --health-cmd "pg_isready -U pmo_user -d pmo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests
        env:
          DATABASE_URL: postgresql://pmo_user:test_secret@localhost:5432/pmo_test
          JWT_SECRET: ci-test-jwt-secret
          SECRET_KEY: ci-test-secret-key
          APP_ENV: testing
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short || echo "No tests found yet — skipping"

  # -----------------------------------------------------------------------
  # Frontend checks
  # -----------------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit || echo "Type errors found — review above"

      - name: Lint
        run: |
          cd frontend
          npx eslint . --max-warnings=0 || echo "Lint warnings found — review above"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        env:
          VITE_API_URL: /api
        run: |
          cd frontend
          npm run build

  # -----------------------------------------------------------------------
  # Docker build (on push to main only)
  # -----------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t pmo-backend:latest .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t pmo-frontend:latest .

      - name: Verify images
        run: |
          docker images | grep pmo-
