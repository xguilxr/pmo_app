---
# cPanel Git Version Control - Deployment script.
#
# This file is read by the "Pull or Deploy" button in cPanel Git Version
# Control. Tasks run as the cPanel user from the repository path
# (/home2/pmas/repositories/pmo_app) after a successful `git pull`.
#
# Layout (see docs/deploy-hostgator.md, Ruta B):
#   /home2/pmas/repositories/pmo_app/   <- this repo (source of truth)
#   /home2/pmas/pmo_app/                <- live application directory
#   /home2/pmas/pmo_app/.env            <- secrets (created manually, NEVER in git)
#   /home2/pmas/pmo_app/backend/        <- code served by Application Manager
#   /home2/pmas/virtualenv/pmo_app/backend/3.10/  <- virtualenv (managed by cPanel)
#
# The .env file at /home2/pmas/pmo_app/.env is loaded by passenger_wsgi.py
# and is NEVER overwritten by this deploy.
#
# NOTE: cPanel's deploy runner does not reliably expose $HOME, so use
# absolute paths. If the cPanel username changes, update DEPLOYPATH below.

deployment:
  tasks:
    - export DEPLOYPATH=/home2/pmas/pmo_app
    - /bin/mkdir -p $DEPLOYPATH/backend/tmp
    - /bin/mkdir -p $DEPLOYPATH/docker
    - /bin/cp -Rfp backend/. $DEPLOYPATH/backend/
    - /bin/cp -Rfp docker/. $DEPLOYPATH/docker/
    - /bin/cp -fp deploy.sh $DEPLOYPATH/
    - /bin/cp -fp .env.example $DEPLOYPATH/
    - /bin/touch $DEPLOYPATH/backend/tmp/restart.txt
